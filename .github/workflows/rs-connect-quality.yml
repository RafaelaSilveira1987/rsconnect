name: RS Connect — Qualidade e Regressão

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-regression:
    name: PHP ${{ matrix.php }} - Sintaxe e Regressão Crítica
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, pdo_mysql, openssl
          coverage: none
      - name: Validar sintaxe
        run: php bin/qa.php --suite=lint
      - name: Validar regressões críticas
        run: php bin/qa.php --suite=critical
      - name: Publicar relatórios JSON e JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-php-${{ matrix.php }}
          path: storage/qa-reports/
          if-no-files-found: warn
