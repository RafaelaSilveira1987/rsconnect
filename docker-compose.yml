services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-rs_connect}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build: .
    command: ["php", "bin/migrate.php", "bootstrap", "--yes"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rs_connect}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MIGRATIONS_LOCK_TIMEOUT: ${MIGRATIONS_LOCK_TIMEOUT:-30}
      MIGRATION_ACTOR: docker-compose
    volumes:
      - ./:/var/www/html
      - rsconnect_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rs_connect}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ./:/var/www/html
      - rsconnect_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
  rsconnect_storage:
